---
- name: Find existing dotfiles to backup
  ansible.builtin.find:
    paths: "{{ dotfiles_user_home }}"
    patterns:
      - ".bashrc"
      - ".zshrc"
      - ".vimrc"
      - ".tmux.conf"
      - ".gitconfig"
      - ".profile"
      - ".bash_profile"
    file_type: file
  register: existing_dotfiles

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ dotfiles_user_home }}/.dotfiles_backup"
    state: directory
    mode: "0755"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
  when: existing_dotfiles.files | length > 0
  become: true

- name: Backup existing dotfiles
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ dotfiles_user_home }}/.dotfiles_backup/{{ item.path | basename }}.{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: preserve
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
  loop: "{{ existing_dotfiles.files }}"
  when: existing_dotfiles.files | length > 0
  loop_control:
    label: "{{ item.path | basename }}"
  become: true
