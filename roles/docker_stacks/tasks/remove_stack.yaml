---
# Docker Stack Removal Tasks
# Handles removal of Docker Swarm stacks

- name: Validate stack removal configuration
  ansible.builtin.assert:
    that:
      - stack_item.name is defined
      - stack_item.name | length > 0
    fail_msg: "Invalid stack removal configuration: name is undefined or empty"
    success_msg: "Stack removal configuration validated"

- name: Check if stack should be removed on this host
  ansible.builtin.set_fact:
    docker_stacks_should_remove: "{{ inventory_hostname == docker_swarm_manager | default('localhost') }}" # noqa: var-naming[no-role-prefix]

- name: Skip stack removal - not deploy host
  ansible.builtin.debug:
    msg: >-
      Skipping stack removal {{ stack_item.name }} - not deploy host
      ({{ inventory_hostname }} != {{ docker_swarm_manager | default('localhost') }})
  when: not docker_stacks_should_remove

- name: Remove Docker Swarm stack
  ansible.builtin.command: docker stack rm {{ stack_item.name }}
  register: docker_stacks_remove_result
  when: docker_stacks_should_remove
  changed_when: docker_stacks_remove_result.rc == 0
  failed_when: false

- name: Remove stack directory
  ansible.builtin.file:
    path: "{{ docker_stacks_base_dir }}/{{ stack_item.name }}"
    state: absent
  when:
    - docker_stacks_should_remove
    - docker_stacks_remove_result is succeeded
