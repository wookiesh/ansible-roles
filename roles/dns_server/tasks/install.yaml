---
- name: Create Technitium install directory
  ansible.builtin.file:
    path: "{{ dns_server_install_dir }}"
    state: directory
    owner: root
    group: "{{ docker_host_services_group | default('docker') }}"
    mode: "2775"
  become: true

- name: Ensure systemd-resolved config directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Disable systemd-resolved stub listener with fallback DNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/nostub.conf
    content: |
      [Resolve]
      DNSStubListener=no
      DNS={{ dns_server_fallback_dns | join(' ') }}
      FallbackDNS={{ dns_server_fallback_dns | join(' ') }}
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart systemd-resolved

- name: Create Traefik network
  community.docker.docker_network:
    name: "{{ dns_server_network }}"
    driver: bridge

- name: Deploy Technitium compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ dns_server_compose_file }}"
    owner: root
    group: "{{ docker_host_services_group | default('docker') }}"
    mode: "0640"
  notify: Restart technitium
  become: true
