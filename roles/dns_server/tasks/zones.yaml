---
- name: Configure DNS zones
  when: dns_server_zones | length > 0
  vars:
    dns_server__is_primary: "{{ inventory_hostname == groups[dns_server_group_name][0] }}"
    dns_server__primary_node_ip: "{{ hostvars[groups[dns_server_group_name][0]].ansible_host }}"
  block:
    - name: Wait for Technitium API to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ dns_server_ui_port }}"
        timeout: 60

    - name: Authenticate to Technitium API
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/user/login"
        method: GET
        body_format: form-urlencoded
        body:
          user: admin
          pass: "{{ dns_server_admin_password }}"
        return_content: true
      register: dns_server__auth
      no_log: true

    - name: Create DNS zones
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/zones/create"
        method: GET
        body_format: form-urlencoded
        body: "{{ dns_server__zone_params }}"
        return_content: true
      vars:
        dns_server__type: "{{ item.primary_type if dns_server__is_primary | bool else item.secondary_type }}"
        dns_server__needs_primary_ns: "{{ dns_server__type in ['Secondary', 'SecondaryForwarder', 'Stub'] and not (dns_server__is_primary | bool) }}"
        dns_server__zone_base:
          token: "{{ dns_server__auth.json.token }}"
          zone: "{{ item.name }}"
          type: "{{ dns_server__type }}"
        dns_server__zone_extra: >-
          {{
            ({'primaryNameServerAddresses': item.primary_nameservers | default([dns_server__primary_node_ip]) | join(',')}
              if dns_server__needs_primary_ns | bool else {})
            | combine({'forwarder': (item.forwarder if item.forwarder is string else item.forwarder[0])}
              if item.forwarder is defined else {})
            | combine({'dnssecValidation': item.dnssec_validation | string | lower}
              if item.dnssec_validation is defined else {})
          }}
        dns_server__zone_params: "{{ dns_server__zone_base | combine(dns_server__zone_extra) }}"
      register: dns_server__zone_result
      failed_when:
        - dns_server__zone_result.json.status == 'error'
        - "'Zone already exists' not in (dns_server__zone_result.json.errorMessage | default(''))"
      changed_when: dns_server__zone_result.json.status == 'ok'
      loop: "{{ dns_server_zones }}"
      loop_control:
        label: "{{ item.name }} ({{ item.primary_type if dns_server__is_primary | bool else item.secondary_type }})"

    - name: Configure zone transfer and notify on primary zones
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/zones/options/set"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ dns_server__auth.json.token }}"
          zone: "{{ item.name }}"
          zoneTransfer: "UseSpecifiedNetworkACL"
          zoneTransferNetworkACL: "{{ dns_server__secondary_node_ip }}"
          notify: "SpecifiedNameServers"
          notifyNameServers: "{{ dns_server__secondary_node_ip }}"
        return_content: true
      vars:
        dns_server__secondary_node_ip: "{{ hostvars[groups[dns_server_group_name][1]].ansible_host }}"
      register: dns_server__zone_options_result
      failed_when: dns_server__zone_options_result.json.status == 'error'
      changed_when: false
      when:
        - dns_server__is_primary | bool
        - groups[dns_server_group_name] | length > 1
      loop: "{{ dns_server_zones }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create DNS records
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/zones/records/add"
        method: GET
        body_format: form-urlencoded
        body: "{{ dns_server__record_params }}"
        return_content: true
      vars:
        dns_server__zone: "{{ item[0] }}"
        dns_server__record: "{{ item[1] }}"
        dns_server__type_extra:
          A:
            {
              ipAddress: "{{ dns_server__record.value }}",
              ptr: "true",
              createPtrZone: "true",
            }
          CNAME: { cname: "{{ dns_server__record.value }}" }
          FWD: { forwarder: "{{ dns_server__record.value }}" }
          PTR: { ptrName: "{{ dns_server__record.value }}" }
          TXT: { text: "{{ dns_server__record.value }}" }
        dns_server__record_params: >-
          {{
            {
              'token': dns_server__auth.json.token,
              'zone': dns_server__zone.name,
              'domain': (dns_server__record.name ~ '.' ~ dns_server__zone.name) if dns_server__record.name != '@' else dns_server__zone.name,
              'type': dns_server__record.type,
              'ttl': dns_server__record.ttl | default(3600)
            } | combine(dns_server__type_extra[dns_server__record.type])
          }}
      register: dns_server__record_result
      failed_when:
        - dns_server__record_result.json.status == 'error'
        - "'already exists' not in (dns_server__record_result.json.errorMessage | default('') | lower)"
      changed_when: dns_server__record_result.json.status == 'ok'
      when: dns_server__is_primary | bool
      loop: "{{ dns_server_zones | subelements('records', skip_missing=True) }}"
      loop_control:
        label: "{{ item[1].name }}.{{ item[0].name }} {{ item[1].type }} {{ item[1].value }}"

    - name: Build A records from inventory groups
      ansible.builtin.set_fact:
        dns_server__auto_a_records: >-
          {%- set records = [] -%}
          {%- for zone in dns_server_zones -%}
            {%- if zone.auto_a_records_from_groups is defined -%}
              {%- for group_name in zone.auto_a_records_from_groups -%}
                {%- for hostname in groups[group_name] | default([]) -%}
                  {%- set ip = hostvars[hostname].ansible_host | default('') | string -%}
                  {%- if ip and ip != 'localhost' and '.' in ip -%}
                    {%- set _ = records.append({'zone': zone.name, 'name': hostname, 'ip': ip}) -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endfor -%}
          {{ records }}

    - name: Create A records from inventory groups
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/zones/records/add"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ dns_server__auth.json.token }}"
          zone: "{{ item.zone }}"
          domain: "{{ item.name }}.{{ item.zone }}"
          type: A
          ipAddress: "{{ item.ip }}"
          ttl: 3600
          ptr: "true"
          createPtrZone: "true"
        return_content: true
      register: dns_server__auto_record_result
      failed_when:
        - dns_server__auto_record_result.json.status == 'error'
        - "'already exists' not in (dns_server__auto_record_result.json.errorMessage | default('') | lower)"
      changed_when: dns_server__auto_record_result.json.status == 'ok'
      when: dns_server__is_primary | bool
      loop: "{{ dns_server__auto_a_records | default([]) }}"
      loop_control:
        label: "{{ item.name }}.{{ item.zone }} A {{ item.ip }}"

    - name: Authenticate to primary Technitium API
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/user/login"
        method: GET
        body_format: form-urlencoded
        body:
          user: admin
          pass: "{{ dns_server_admin_password }}"
        return_content: true
      register: dns_server__primary_auth
      no_log: true
      delegate_to: "{{ groups[dns_server_group_name][0] }}"
      when: not (dns_server__is_primary | bool)

    - name: List all Primary zones on primary node
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/zones/list"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ dns_server__primary_auth.json.token }}"
        return_content: true
      register: dns_server__primary_zones_list
      no_log: true
      delegate_to: "{{ groups[dns_server_group_name][0] }}"
      when: not (dns_server__is_primary | bool)

    - name: Build list of non-internal Primary zones to sync
      ansible.builtin.set_fact:
        dns_server__zones_to_sync: >-
          {{
            dns_server__primary_zones_list.json.response.zones
            | selectattr('type', 'equalto', 'Primary')
            | rejectattr('internal', 'equalto', true)
            | list
          }}
      when: not (dns_server__is_primary | bool)

    - name: Create missing Secondary zones discovered on primary
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/zones/create"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ dns_server__auth.json.token }}"
          zone: "{{ item.name }}"
          type: Secondary
          primaryNameServerAddresses: "{{ dns_server__primary_node_ip }}"
        return_content: true
      register: dns_server__discovered_zone_result
      failed_when:
        - dns_server__discovered_zone_result.json.status == 'error'
        - "'Zone already exists' not in (dns_server__discovered_zone_result.json.errorMessage | default(''))"
      changed_when: dns_server__discovered_zone_result.json.status == 'ok'
      when: not (dns_server__is_primary | bool)
      loop: "{{ dns_server__zones_to_sync | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Resync all Secondary zones from primary
      ansible.builtin.uri:
        url: "http://localhost:{{ dns_server_ui_port }}/api/zones/resync"
        method: GET
        body_format: form-urlencoded
        body:
          token: "{{ dns_server__auth.json.token }}"
          zone: "{{ item.name }}"
        return_content: true
      register: dns_server__resync_result
      failed_when: dns_server__resync_result.json.status == 'error'
      changed_when: false
      when: not (dns_server__is_primary | bool)
      loop: "{{ dns_server__zones_to_sync | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
