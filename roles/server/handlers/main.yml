---
# =============================================================================
# SERVER ROLE HANDLERS
# =============================================================================

- name: Restart network services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  become: true
  loop:
    - systemd-networkd
    - NetworkManager
  failed_when: false

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  become: true

- name: Restart unattended-upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: restarted
  become: true
  when: server_automatic_updates_enabled
