---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - tailscale_enabled is defined
      - tailscale_enabled is boolean
      - tailscale_install_method in ['repository', 'script', 'package']
      - tailscale_auth_method in ['authkey', 'oauth', 'interactive']
      - tailscale_log_level in ['debug', 'info', 'warn', 'error']
      - tailscale_network_mode in ['userspace', 'kernel']
      - tailscale_port is number
      - tailscale_port > 0 and tailscale_port < 65536
    fail_msg: |
      ❌ Invalid Tailscale configuration:
      - tailscale_enabled: {{ tailscale_enabled | default('UNDEFINED') }}
      - tailscale_install_method: {{ tailscale_install_method | default('UNDEFINED') }}
      - tailscale_auth_method: {{ tailscale_auth_method | default('UNDEFINED') }}
      - tailscale_log_level: {{ tailscale_log_level | default('UNDEFINED') }}
      - tailscale_network_mode: {{ tailscale_network_mode | default('UNDEFINED') }}
      - tailscale_port: {{ tailscale_port | default('UNDEFINED') }}

      Required: boolean enabled, valid install_method, valid auth_method, valid log_level, valid network_mode, valid port (1-65535)
    success_msg: "✅ All Tailscale variables validated successfully"

- name: Validate authentication configuration
  ansible.builtin.assert:
    that:
      - tailscale_auth_method != 'authkey' or tailscale_auth_key is defined
      - tailscale_auth_method != 'authkey' or tailscale_auth_key | length > 0
      - tailscale_auth_method != 'oauth' or (tailscale_oauth_client_id is defined and tailscale_oauth_client_secret is defined)
    fail_msg: |
      ❌ Invalid authentication configuration for {{ tailscale_auth_method }}:
      - authkey: requires tailscale_auth_key
      - oauth: requires tailscale_oauth_client_id and tailscale_oauth_client_secret
    success_msg: "✅ Authentication configuration validated"
  when: tailscale_enabled

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family | lower }}.yaml"
  when: tailscale_enabled
  failed_when: false

- name: Set OS-specific package facts
  ansible.builtin.set_fact:
    tailscale_packages: "{{ lookup('vars', 'tailscale_packages_' + ansible_os_family | lower) | default(tailscale_packages_debian) }}"
  when: tailscale_enabled

- name: Check if Tailscale is already installed
  ansible.builtin.stat:
    path: "/usr/sbin/tailscale"
  register: tailscale_install_check
  when: tailscale_enabled

- name: Install Tailscale prerequisites
  ansible.builtin.package:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
  when:
    - tailscale_enabled
    - tailscale_install_method == 'repository'
    - not tailscale_install_check.stat.exists

- name: Add Tailscale repository (Debian/Ubuntu)
  when:
    - tailscale_enabled
    - tailscale_install_method == 'repository'
    - ansible_os_family == "Debian"
    - not tailscale_install_check.stat.exists
  block:
    - name: Check if Tailscale GPG key exists
      ansible.builtin.stat:
        path: "{{ tailscale_repository_key_path }}"
      register: tailscale_gpg_key_check

    - name: Check if Tailscale repository list exists
      ansible.builtin.stat:
        path: "{{ tailscale_repository_list_path }}"
      register: tailscale_repo_list_check

    - name: Add Tailscale GPG key
      ansible.builtin.shell: |
        curl -fsSL {{ tailscale_repository_key_url }} | tee {{ tailscale_repository_key_path }} >/dev/null
      when: not tailscale_gpg_key_check.stat.exists
      register: tailscale_gpg_key

    - name: Add Tailscale repository list
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.tailscale-keyring.list | tee {{ tailscale_repository_list_path }}
      when: not tailscale_repo_list_check.stat.exists
      register: tailscale_repo_list

    - name: Update apt cache only when repository changes
      ansible.builtin.apt:
        update_cache: true
      when:
        - not tailscale_gpg_key_check.stat.exists or not tailscale_repo_list_check.stat.exists
        - (tailscale_gpg_key is succeeded or tailscale_repo_list is succeeded)

- name: Install Tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present
  register: tailscale_install_result
  when:
    - tailscale_enabled
    - tailscale_install_method in ['repository', 'package']
    - not tailscale_install_check.stat.exists

- name: Install Tailscale via script (fallback)
  when:
    - tailscale_enabled
    - tailscale_install_method == 'script'
    - not tailscale_install_check.stat.exists
  block:
    - name: Download Tailscale install script
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale_install.sh
        mode: "0755"
      register: tailscale_script_download

    - name: Run Tailscale install script
      ansible.builtin.shell: /tmp/tailscale_install.sh
      args:
        creates: /usr/sbin/tailscale
      environment:
        TS_INSTALL_METHOD: "{{ tailscale_install_method }}"
      register: tailscale_script_install
      when: tailscale_script_download is succeeded

- name: Check if Tailscale config exists
  ansible.builtin.stat:
    path: "{{ tailscale_config_file }}"
  register: tailscale_config_check
  when: tailscale_enabled

- name: Configure Tailscale daemon environment
  ansible.builtin.template:
    src: tailscaled.env.j2
    dest: "{{ tailscale_config_file }}"
    mode: "{{ tailscale_file_permissions }}"
    owner: root
    group: root
    backup: "{{ tailscale_backup_config }}"
  notify: Restart Tailscale
  when: tailscale_enabled
  register: tailscale_config_result

- name: Enable and start Tailscale service
  ansible.builtin.systemd:
    name: tailscaled
    enabled: "{{ tailscale_service_enabled }}"
    state: "{{ tailscale_service_state }}"
    daemon_reload: true
  when: tailscale_enabled
  register: tailscale_service_result

- name: Check if Tailscale is already authenticated
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_check
  failed_when: false
  changed_when: false
  when: tailscale_enabled

- name: Set authentication facts
  ansible.builtin.set_fact:
    tailscale_needs_auth: >-
      {{
        tailscale_force_reauth or
        tailscale_status_check.rc != 0 or
        (tailscale_status_check.stdout | from_json | default({})).BackendState != 'Running' or
        (tailscale_status_check.stdout | from_json | default({})).Self | length == 0 or
        not ((tailscale_status_check.stdout | from_json | default({})).Self.Online | default(false))
      }}
  when: tailscale_enabled

- name: Display authentication status
  ansible.builtin.debug:
    msg: |
      ✅ Tailscale already authenticated and connected
      - Backend State: {{ (tailscale_status_check.stdout | from_json).BackendState }}
      - Self: {{ (tailscale_status_check.stdout | from_json).Self.TailscaleIPs | first | default('Not assigned') }}
      - Online: {{ (tailscale_status_check.stdout | from_json).Self.Online | default(false) }}
  when:
    - tailscale_enabled
    - not tailscale_needs_auth
    - tailscale_status_check.rc == 0

- name: Authenticate with Tailscale (authkey)
  ansible.builtin.command: tailscale up --authkey={{ tailscale_auth_key }}
  environment:
    TS_AUTHKEY: "{{ tailscale_auth_key }}"
  register: tailscale_auth_result
  retries: 3
  delay: 10
  until: tailscale_auth_result is succeeded
  when:
    - tailscale_enabled
    - tailscale_needs_auth
    - tailscale_auth_method == 'authkey'
    - tailscale_auth_key | length > 0
  notify: Restart Tailscale

- name: Authenticate with Tailscale (oauth)
  ansible.builtin.command: tailscale up --auth=oauth
  register: tailscale_oauth_result
  when:
    - tailscale_enabled
    - tailscale_needs_auth
    - tailscale_auth_method == 'oauth'
  notify: Restart Tailscale

- name: Check if Tailscale networking needs reconfiguration
  ansible.builtin.set_fact:
    tailscale_needs_network_config: >-
      {{
        tailscale_advertise_routes | length > 0 or
        not tailscale_accept_routes or
        tailscale_advertise_exit_node or
        tailscale_exit_node != "" or
        tailscale_tags | length > 0
      }}

- name: Configure Tailscale networking
  ansible.builtin.command: |
    tailscale up
    --advertise-routes={{ tailscale_advertise_routes | join(',') if tailscale_advertise_routes else '' }}
    --accept-routes={{ tailscale_accept_routes | ternary('true', 'false') }}
    --advertise-exit-node={{ tailscale_advertise_exit_node | ternary('true', 'false') }}
    --exit-node={{ tailscale_exit_node if tailscale_exit_node else '' }}
    --exit-node-allow-lan-access={{ tailscale_exit_node_allow_lan_access | ternary('true', 'false') }}
    --accept-dns={{ tailscale_accept_dns | ternary('true', 'false') }}
    --advertise-tags={{ tailscale_tags | join(',') if tailscale_tags else '' }}
    --reset={{ tailscale_reset | ternary('true', 'false') }}
  register: tailscale_network_config
  when:
    - tailscale_enabled
    - tailscale_needs_network_config
  notify: Restart Tailscale

- name: Configure firewall rules
  ansible.builtin.include_tasks: firewall.yaml
  when:
    - tailscale_enabled
    - tailscale_configure_firewall

- name: Verify Tailscale connectivity
  ansible.builtin.command: tailscale status
  register: tailscale_verify_status
  failed_when: tailscale_verify_status.rc != 0
  changed_when: false
  retries: 5
  delay: 10
  when: tailscale_enabled

- name: Get Tailscale status information
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_json
  changed_when: false
  when: tailscale_enabled

- name: Display Tailscale status
  ansible.builtin.debug:
    msg: |
      ✅ Tailscale Status:
      - Backend State: {{ (tailscale_status_json.stdout | from_json).BackendState }}
      - Self: {{ (tailscale_status_json.stdout | from_json).Self.TailscaleIPs | first | default('Not assigned') }}
      - Version: {{ (tailscale_status_json.stdout | from_json).Version }}
  when:
    - tailscale_enabled
    - tailscale_status_json.rc == 0

- name: Cleanup installation script
  ansible.builtin.file:
    path: /tmp/tailscale_install.sh
    state: absent
  when: tailscale_install_method == 'script'
