---
- name: Test Tailscale role
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    tailscale_enabled: true
    tailscale_install_method: "repository"
    tailscale_auth_method: "authkey"
    tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"

  tasks:
    - name: Include Tailscale role
      ansible.builtin.include_role:
        name: tailscale

  post_tasks:
    - name: Verify Tailscale binary exists
      ansible.builtin.stat:
        path: "/usr/sbin/tailscale"
      register: tailscale_binary
      failed_when: not tailscale_binary.stat.exists

    - name: Verify tailscaled service is active
      ansible.builtin.systemd:
        name: tailscaled
      register: tailscale_service
      failed_when: tailscale_service.status.ActiveState != "active"
