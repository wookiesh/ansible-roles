---
- name: Test Traefik role
  hosts: test_hosts
  become: true
  vars:
    traefik_domain: "traefik.test.local"
    vault_cloudflare_dns_api_token: "test_token"

  tasks:
    - name: Include Traefik role
      ansible.builtin.include_role:
        name: traefik

  post_tasks:
    - name: Verify install directory exists
      ansible.builtin.stat:
        path: "{{ traefik_install_dir }}"
      register: traefik_dir
      failed_when: not traefik_dir.stat.exists

    - name: Verify compose file exists
      ansible.builtin.stat:
        path: "{{ traefik_compose_file }}"
      register: traefik_compose
      failed_when: not traefik_compose.stat.exists
