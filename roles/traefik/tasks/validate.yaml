---
- name: Validate Cloudflare DNS API token (ACME mode only)
  ansible.builtin.assert:
    that:
      - vault_cloudflare_dns_api_token is defined
      - vault_cloudflare_dns_api_token | length > 0
    fail_msg: |
      ❌ Missing required variable: vault_cloudflare_dns_api_token

      Traefik ACME requires a Cloudflare DNS API token for SSL certificate generation.
      Please add to your vault.yml:

      vault_cloudflare_dns_api_token: "your_cloudflare_dns_api_token_here"
    success_msg: "✅ Cloudflare DNS API token is present"
  when: traefik_acme_enabled | default(false)

- name: Validate Traefik domain configuration
  ansible.builtin.assert:
    that:
      - traefik_domain is defined
      - traefik_domain | length > 0
      - traefik_domain is match('^[a-zA-Z0-9.-]+$')
    fail_msg: "❌ Invalid Traefik domain: {{ traefik_domain | default('UNDEFINED') }}"
    success_msg: "✅ Traefik domain is valid: {{ traefik_domain }}"

- name: Validate Traefik static configuration
  ansible.builtin.assert:
    that:
      - traefik_static_config is defined
      - traefik_static_config is mapping
      - traefik_static_config.entryPoints is defined
      - traefik_static_config.entryPoints.web is defined
      - traefik_static_config.entryPoints.websecure is defined
    fail_msg: |
      ❌ Invalid Traefik static configuration:
      - traefik_static_config: {{ traefik_static_config | default('UNDEFINED') }}
      Required: traefik_static_config must contain entryPoints.web and entryPoints.websecure
    success_msg: "✅ Traefik static configuration is valid"

- name: Validate Traefik entryPoints configuration
  ansible.builtin.assert:
    that:
      - traefik_static_config.entryPoints.web.address is defined
      - traefik_static_config.entryPoints.websecure.address is defined
      - traefik_static_config.entryPoints.web.address is match('.*:[0-9]+')
      - traefik_static_config.entryPoints.websecure.address is match('.*:[0-9]+')
      - (traefik_static_config.entryPoints.web.address | regex_replace('.*:(\\d+)', '\\1') | int) > 0
      - (traefik_static_config.entryPoints.web.address | regex_replace('.*:(\\d+)', '\\1') | int) < 65536
      - (traefik_static_config.entryPoints.websecure.address | regex_replace('.*:(\\d+)', '\\1') | int) > 0
      - (traefik_static_config.entryPoints.websecure.address | regex_replace('.*:(\\d+)', '\\1') | int) < 65536
    fail_msg: |
      ❌ Invalid Traefik entryPoints configuration:
      - Web entryPoint: {{ traefik_static_config.entryPoints.web.address | default('UNDEFINED') }}
      - Websecure entryPoint: {{ traefik_static_config.entryPoints.websecure.address | default('UNDEFINED') }}
      Required: Both entryPoints must have valid port numbers (1-65535)
    success_msg: "✅ Traefik entryPoints are valid"

- name: Validate Traefik providers configuration
  ansible.builtin.assert:
    that:
      - traefik_static_config.providers is defined
      - traefik_static_config.providers is mapping
    fail_msg: |
      ❌ Invalid Traefik providers configuration:
      - providers: {{ traefik_static_config.providers | default('UNDEFINED') }}
      Required: traefik_static_config must contain providers section
    success_msg: "✅ Traefik providers configuration is valid"

- name: Validate Traefik provider based on deployment mode
  ansible.builtin.assert:
    that:
      - traefik_deployment_mode == "compose" and traefik_static_config.providers.docker is defined or
        traefik_deployment_mode == "swarm" and (traefik_static_config.providers.docker is defined or traefik_static_config.providers.swarm is defined)
    fail_msg: |
      ❌ Missing required provider for deployment mode {{ traefik_deployment_mode }}:
      - Compose mode requires: traefik_static_config.providers.docker
      - Swarm mode requires: traefik_static_config.providers.docker or traefik_static_config.providers.swarm
      Current providers: {{ traefik_static_config.providers | default('UNDEFINED') }}
    success_msg: "✅ Traefik provider configuration matches deployment mode"

- name: Validate Traefik dynamic configuration
  ansible.builtin.assert:
    that:
      - traefik_dynamic_config is defined
      - traefik_dynamic_config is mapping
    fail_msg: |
      ❌ Invalid Traefik dynamic configuration:
      - traefik_dynamic_config: {{ traefik_dynamic_config | default('UNDEFINED') }}
      Required: traefik_dynamic_config must be a valid mapping
    success_msg: "✅ Traefik dynamic configuration is valid"

- name: Validate Docker integration
  ansible.builtin.assert:
    that:
      - traefik_docker_services_root is defined
      - traefik_docker_services_root | length > 0
      - traefik_docker_services_group is defined
      - traefik_docker_services_group | length > 0
    fail_msg: |
      ❌ Docker integration variables are missing or invalid.
      Make sure docker_host role is properly configured.
    success_msg: "✅ Docker integration variables are valid"
