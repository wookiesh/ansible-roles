---
# Traefik secrets management — swarm mode uses Docker secrets, compose mode uses cert files

# ── Compose mode: write cert files from vault ─────────────────────────────────
- name: Create Traefik TLS cert directory (compose mode)
  ansible.builtin.file:
    path: "{{ traefik_tls_cert_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  when:
    - traefik_deployment_mode == "compose"
    - traefik_tls_cert_dir | length > 0

- name: Deploy TLS cert files from vault (compose mode)
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ traefik_tls_cert_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  loop:
    - name: cert.pem
      content: "{{ vault_traefik_tls_cert }}"
    - name: key.pem
      content: "{{ vault_traefik_tls_key }}"
  when:
    - traefik_deployment_mode == "compose"
    - traefik_tls_cert_dir | length > 0
  no_log: true
  notify: Restart Traefik

# ── Swarm mode: Docker secrets ────────────────────────────────────────────────
- name: Validate vault variables for secrets
  ansible.builtin.assert:
    that:
      - vault_traefik_tls_cert is defined
      - vault_traefik_tls_key is defined
    fail_msg: |
      ❌ Missing required vault variables for Traefik secrets:
      - vault_traefik_tls_cert: {{ vault_traefik_tls_cert | default('UNDEFINED') }}
      - vault_traefik_tls_key: {{ vault_traefik_tls_key | default('UNDEFINED') }}

      Please add to your inventory vault file:
      vault_traefik_tls_cert: |
        -----BEGIN CERTIFICATE-----
        ... your certificate content ...
        -----END CERTIFICATE-----
      vault_traefik_tls_key: |
        -----BEGIN PRIVATE KEY-----
        ... your private key content ...
        -----END PRIVATE KEY-----
    success_msg: "✅ Vault variables for Traefik secrets are present"
  when:
    - traefik_deployment_mode == "swarm"
    - traefik_require_real_secrets | default(true)
    - inventory_hostname == docker_swarm_manager

- name: Create Traefik secrets in Docker Swarm
  community.docker.docker_secret:
    name: "{{ item.name }}"
    data: "{{ item.content }}"
    state: present
  loop:
    - name: "{{ traefik_tls_secret_cert }}"
      content: "{{ vault_traefik_tls_cert }}"
    - name: "{{ traefik_tls_secret_key }}"
      content: "{{ vault_traefik_tls_key }}"
  when:
    - traefik_deployment_mode == "swarm"
    - inventory_hostname == docker_swarm_manager

- name: Update Traefik secrets when changed
  community.docker.docker_secret:
    name: "{{ item.name }}"
    data: "{{ item.content }}"
    state: present
    force: true
  loop:
    - name: "{{ traefik_tls_secret_cert }}"
      content: "{{ vault_traefik_tls_cert }}"
    - name: "{{ traefik_tls_secret_key }}"
      content: "{{ vault_traefik_tls_key }}"
  when:
    - traefik_deployment_mode == "swarm"
    - traefik_force_secrets_update | default(false)
    - inventory_hostname == docker_swarm_manager
