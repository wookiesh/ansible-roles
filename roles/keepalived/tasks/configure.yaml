- name: Create keepalived environment file
  ansible.builtin.template:
    src: keepalived.env.j2
    dest: "{{ keepalived_config_dir }}/keepalived"
    mode: "0600"
    owner: "{{ keepalived_config_owner }}"
    group: "{{ keepalived_config_group }}"
    backup: "{{ keepalived_config_backup }}"
  become: true
  when: keepalived_enable_non_root or keepalived_metrics_enabled
  notify: Restart keepalived

- name: Configure log rotation for keepalived
  ansible.builtin.template:
    src: logrotate.j2
    dest: "/etc/logrotate.d/keepalived"
    mode: "0644"
    owner: root
    group: root
  become: true
  when: keepalived_log_dir != "/var/log" or keepalived_log_file != "/var/log/keepalived.log"

- name: Create stats socket directory
  ansible.builtin.file:
    path: "{{ keepalived_stats_socket | dirname }}"
    state: directory
    mode: "0755"
    owner: "{{ keepalived_user }}"
    group: "{{ keepalived_group }}"
  become: true
  when: keepalived_metrics_enabled

- name: Check if ufw is installed
  ansible.builtin.command:
    cmd: "which ufw"
  register: keepalived_ufw_check
  changed_when: false
  failed_when: false

- name: Configure firewall for VRRP (ufw)
  ansible.builtin.command: ufw allow proto vrrp from any to any comment "Allow VRRP for keepalived"
  when:
    - ansible_os_family == "Debian"
    - keepalived_ufw_check.rc == 0
  become: true
  changed_when: true
  failed_when: false

- name: Configure firewall for VRRP (firewalld)
  ansible.posix.firewalld:
    service: vrrp
    state: enabled
    permanent: true
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - "'firewalld' in ansible_facts.packages"
  become: true
  failed_when: false

- name: Check if nftables is active
  ansible.builtin.systemd:
    name: nftables
  register: keepalived_nftables_check
  failed_when: false

- name: Configure nftables for VRRP and ICMP return traffic
  ansible.builtin.template:
    src: nftables-vrrp.j2
    dest: "/etc/nftables.d/keepalived-vrrp.nft"
    mode: "0644"
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version is version('24.04', '>=')
    - keepalived_nftables_check.status is defined
    - keepalived_nftables_check.status.ActiveState == "active"
  notify: Reload nftables
  become: true
  failed_when: false

- name: Configure firewall for VRRP (firewalld)
  ansible.posix.firewalld:
    service: vrrp
    state: enabled
    permanent: true
    immediate: true
  when:
    - ansible_os_family == "RedHat"
    - "'firewalld' in ansible_facts.packages"
  become: true
  failed_when: false

- name: Configure iptables for ICMP return traffic
  ansible.builtin.iptables:
    table: filter
    chain: FORWARD
    source: "{{ keepalived_vrrp_instances[0].virtual_ipaddress[0].split()[0] }}"
    protocol: icmp
    icmp_type: echo-reply
    jump: ACCEPT
    state: present
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version is version('24.04', '>=')
  become: true

- name: Add keepalived user to required groups
  ansible.builtin.user:
    name: "{{ keepalived_user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - netdev
    - systemd-journal
  when: keepalived_enable_non_root
  become: true
  failed_when: false
