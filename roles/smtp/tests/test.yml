---
- name: Test SMTP role
  hosts: localhost
  become: true
  vars:
    smtp_null_client_enabled: true
    smtp_relayhost: "relay.test.local"
    smtp_relayhost_port: 25
    smtp_domain: "test.local"

  tasks:
    - name: Include SMTP role
      ansible.builtin.include_role:
        name: smtp

  post_tasks:
    - name: Verify Postfix config exists
      ansible.builtin.stat:
        path: /etc/postfix/main.cf
      register: postfix_config
      failed_when: not postfix_config.stat.exists

    - name: Verify Postfix service is active
      ansible.builtin.systemd:
        name: postfix
      register: postfix_service
      failed_when: postfix_service.status.ActiveState != "active"

    - name: Verify null client configuration
      ansible.builtin.command: postconf relayhost inet_interfaces
      register: postfix_settings
      changed_when: false
      failed_when: >
        '[relay.test.local]:25' not in postfix_settings.stdout or
        'loopback-only' not in postfix_settings.stdout

    - name: Verify Postfix configuration syntax
      ansible.builtin.command: postfix check
      changed_when: false
