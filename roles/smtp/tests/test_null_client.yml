---
- name: Test SMTP role with null client (no SASL required)
  hosts: localhost
  become: true
  vars:
    # Test null client configuration - SASL not required
    smtp_null_client_enabled: true
    smtp_relayhost: "smtp.example.com"
    smtp_relayhost_port: 25
    smtp_domain: "example.com"
    smtp_sasl_auth_enable: false  # Not needed for null clients

  pre_tasks:
    - name: Show test environment
      ansible.builtin.debug:
        msg: "Testing SMTP role on {{ ansible_distribution }} with null client mode (no SASL)"

  tasks:
    - name: Include SMTP role
      ansible.builtin.include_role:
        name: smtp

  post_tasks:
    - name: Verify Postfix installation
      ansible.builtin.stat:
        path: /etc/postfix/main.cf
      register: smtp_test_postfix
      failed_when: not smtp_test_postfix.stat.exists

    - name: Verify Postfix service status
      ansible.builtin.systemd:
        name: postfix
      register: smtp_test_service
      failed_when: smtp_test_service.status.ActiveState != "active"

    - name: Verify null client configuration
      ansible.builtin.shell: |
        postconf relayhost inet_interfaces mydestination local_transport
      register: smtp_test_config
      changed_when: false
      failed_when:
        - "'relayhost = [smtp.example.com]:25' not in smtp_test_config.stdout"
        - "'inet_interfaces = 127.0.0.1' not in smtp_test_config.stdout"

    - name: Verify Postfix configuration syntax
      ansible.builtin.command: postfix check
      changed_when: false
