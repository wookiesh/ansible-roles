[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-postfix-exporter --postfix.logfile_path=/var/lib/prometheus/postfix-exporter/mail.log --web.listen-address=127.0.0.1:9154
# The private log file is syslog:adm (rsyslog runs unprivileged and can only
# write files it owns) — add adm so the prometheus user can read it.
SupplementaryGroups=adm
