---
# The prometheus-postfix-exporter package defaults to reading Postfix logs
# from the systemd journal (--systemd.enable --systemd.unit=postfix@-.service).
# That doesn't work on these hosts: Postfix's real master process is NOT
# managed by postfix@-.service (see tasks/main.yml's note on the
# Type=oneshot/ExecStart=/bin/true systemd stub) — journal entries for
# postfix show _SYSTEMD_UNIT=session-XXXX.scope instead, so the exporter
# would silently produce empty metrics forever. Instead, override the
# unit's ExecStart to read the standard /var/log/mail.log directly (same
# file rsyslog already maintains and rotates via its own logrotate config —
# no private copy needed, the exporter is the only other reader).

- name: Install Postfix Prometheus exporter
  ansible.builtin.apt:
    name: prometheus-postfix-exporter
    state: present
    update_cache: true
  become: true

- name: Create postfix-exporter systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-postfix-exporter.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true

# Legitimate systemd drop-in override: unlike postfix.service (a deliberate
# stub that must not be fought — see tasks/main.yml), this is a normal,
# properly systemd-managed unit, and overriding just ExecStart via a drop-in
# is standard Debian admin practice that survives package upgrades.
- name: Override postfix-exporter to read /var/log/mail.log instead of the journal
  ansible.builtin.copy:
    src: prometheus-postfix-exporter-override.conf
    dest: /etc/systemd/system/prometheus-postfix-exporter.service.d/override.conf
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: Restart postfix-exporter

- name: Ensure postfix-exporter is enabled
  ansible.builtin.systemd:
    name: prometheus-postfix-exporter
    enabled: true
    daemon_reload: true
  become: true
