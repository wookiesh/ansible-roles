---
- name: Validate SMTP configuration variables
  ansible.builtin.assert:
    that:
      - smtp_enabled is boolean
      - smtp_mailname is defined
      - smtp_mailname | length > 0
      - smtp_domain is defined
      - smtp_domain | length > 0
      # Ensure only one role is enabled
      - (smtp_null_client_enabled | default(false) and smtp_relayhost_enabled | default(false)) == false
      # Validate null client requirements
      - smtp_null_client_enabled | default(false) == false or smtp_relayhost | length > 0
      - smtp_relayhost_port is number
      - smtp_relayhost_port > 0 and smtp_relayhost_port < 65536
      # Validate relay host requirements
      - smtp_relayhost_enabled | default(false) == false or smtp_relay_domains | length > 0
      - smtp_relayhost_enabled | default(false) == false or smtp_internal_domain | length > 0
      # Validate TLS settings
      - smtp_use_tls is boolean
      - smtp_tls_security_level in ['none', 'may', 'encrypt', 'verify', 'secure']
      # Validate SASL settings (only required for relay hosts)
      - smtp_relayhost_enabled | default(false) == false or smtp_sasl_auth_enable == false or (smtp_sasl_user | length > 0 and smtp_sasl_password | length > 0)
    fail_msg: |
      ❌ Invalid SMTP configuration:
      - smtp_enabled: {{ smtp_enabled }}
      - smtp_null_client_enabled: {{ smtp_null_client_enabled }}
      - smtp_relayhost_enabled: {{ smtp_relayhost_enabled }}
      - smtp_relayhost: {{ smtp_relayhost | default('UNDEFINED') }}
      - smtp_relay_domains: {{ smtp_relay_domains | default('UNDEFINED') }}
      - smtp_sasl_user: {{ smtp_sasl_user | default('UNDEFINED') }}
      - smtp_sasl_password: {{ 'SET' if smtp_sasl_password | length > 0 else 'UNSET' }}
      - smtp_internal_domain: {{ smtp_internal_domain | default('UNDEFINED') }}

      Required: Exactly one of smtp_null_client_enabled or smtp_relayhost_enabled must be true
      Null client: smtp_relayhost must be set
      Relay host: smtp_relay_domains and smtp_internal_domain must be set
      SASL auth: smtp_sasl_user and smtp_sasl_password must be set (only for relay hosts with SASL)
    success_msg: "✅ SMTP variables validated successfully"

- name: Include installation tasks
  ansible.builtin.include_tasks: install.yaml
  when: smtp_enabled
  tags:
    - smtp_install

- name: Include null client configuration
  ansible.builtin.include_tasks: null_client.yaml
  when: smtp_enabled and smtp_null_client_enabled
  tags:
    - smtp_null_client
    - smtp_configure

- name: Include relay host configuration
  ansible.builtin.include_tasks: relayhost.yaml
  when: smtp_enabled and smtp_relayhost_enabled
  tags:
    - smtp_relayhost
    - smtp_configure

- name: Ensure postfix is started and enabled
  ansible.builtin.systemd:
    name: postfix
    state: started
    enabled: true
  become: true
  when: smtp_enabled

- name: Validate final Postfix configuration
  ansible.builtin.command: postfix check
  become: true
  changed_when: false
  register: smtp_postfix_final_check
  failed_when: smtp_postfix_final_check.rc != 0
  when: smtp_enabled
