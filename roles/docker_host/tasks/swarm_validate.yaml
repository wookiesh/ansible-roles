---
- name: Validate Swarm cluster status (managers only)
  community.docker.docker_swarm_info:
  register: docker_host_final_swarm_info
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "manager"
    - docker_host_swarm_info.swarm_facts is defined
    - docker_host_swarm_info.swarm_facts is defined

- name: Get all nodes in Swarm (managers only)
  community.docker.docker_node_info:
  register: docker_host_all_nodes
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "manager"
    - docker_host_swarm_info.swarm_facts is defined
    - docker_host_swarm_info.swarm_facts is defined

- name: Display final Swarm status (managers)
  ansible.builtin.debug:
    msg: |
      ✅ Docker Swarm validation for {{ inventory_hostname }}:
      - Swarm enabled: {{ docker_host_swarm_enabled }}
      - In Swarm: {{ docker_host_final_swarm_info.swarm_facts is defined }}
      - Role: {{ docker_host_swarm_role }}
      - Node ID: {{ docker_host_final_swarm_info.swarm_facts.ID if docker_host_final_swarm_info.swarm_facts is defined else 'N/A' }}
      - Manager Address: {{ docker_host_swarm_advertise_addr if docker_host_final_swarm_info.swarm_facts is defined else 'N/A' }}
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "manager"
    - docker_host_swarm_info.swarm_facts is defined

- name: Display final Swarm status (workers)
  ansible.builtin.debug:
    msg: |
      ✅ Docker Swarm validation for {{ inventory_hostname }}:
      - Swarm enabled: {{ docker_host_swarm_enabled }}
      - Role: {{ docker_host_swarm_role }}
      - Worker status: Checking if node is in cluster...
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "worker"

- name: Display cluster overview (first manager only)
  ansible.builtin.debug:
    msg: |
      📊 Docker Swarm Cluster Overview:
      Total nodes: {{ hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes | length }}
      Managers: {{ hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes | selectattr('Spec.Role', 'equalto', 'manager') | list | length }}
      Workers: {{ hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes | selectattr('Spec.Role', 'equalto', 'worker') | list | length }}

      Node details:
      {% for node in docker_host_all_nodes.nodes %}
      - {{ node.ID[:8] }} ({{ node.Description.Hostname }}):
        Status: {{ node.Status.State }}
        Role: {{ node.Spec.Role }}
        Availability: {{ node.Spec.Availability }}
        {% if node.ManagerStatus is defined %}
        Leader: {{ node.ManagerStatus.Leader | default('false') }}
        Reachability: {{ node.ManagerStatus.Reachability | default('unknown') }}
        {% endif %}
      {% endfor %}
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "manager"
    - docker_host_swarm_info.swarm_facts is defined
    - inventory_hostname == docker_swarm_manager
    - hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes is defined

- name: Assert Swarm cluster health (managers only)
  ansible.builtin.assert:
    that:
      - docker_host_final_swarm_info.swarm_facts is defined
      - docker_host_final_swarm_info.swarm_facts.ID is defined
    fail_msg: |
      ❌ Swarm validation failed for {{ inventory_hostname }}:
      - Expected to be in Swarm but not found
      - Check Docker service status and network connectivity
      - Verify join tokens and firewall rules
    success_msg: "✅ Swarm validation successful for {{ inventory_hostname }}"
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "manager"
    - docker_host_swarm_info.swarm_facts is defined

- name: Assert cluster quorum (managers only)
  ansible.builtin.assert:
    that:
      - (hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes | selectattr('Spec.Role', 'equalto', 'manager') | list | length) >= 1
    fail_msg: |
      ❌ Swarm quorum validation failed:
      - No managers found in cluster
      - At least one manager is required for Swarm to function
    success_msg:
      "✅ Swarm quorum validation successful - {{ docker_host_all_nodes.nodes
      | selectattr('Spec.Role', 'equalto', 'manager') | list | length }} managers detected"
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "manager"
    - docker_host_swarm_info.swarm_facts is defined
    - hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes is defined

- name: Validate worker node status
  ansible.builtin.assert:
    that:
      - hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes |
        selectattr('Description.Hostname', 'equalto', inventory_hostname) | list | length == 1
    fail_msg: |
      ❌ Worker validation failed for {{ inventory_hostname }}:
      - Node not found in cluster
      - Check join status and network connectivity
    success_msg: "✅ Worker validation successful for {{ inventory_hostname }}"
  when:
    - docker_host_swarm_enabled
    - docker_host_swarm_role == "worker"
    - docker_host_swarm_info.swarm_facts is defined
    - hostvars[docker_swarm_manager]["docker_host_all_nodes"] is defined
    - hostvars[docker_swarm_manager]["docker_host_all_nodes"].nodes is defined
