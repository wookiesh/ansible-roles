---
- name: Create Docker daemon configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"
  become: true

- name: Configure Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_host_daemon_config | combine(docker_host_daemon_json) | to_nice_json }}"
    dest: /etc/docker/daemon.json
    mode: "0644"
    backup: true
  become: true
  register: docker_host_daemon_config_result
  when: docker_host_daemon_config is defined or docker_host_daemon_json is defined

- name: Create Docker systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  become: true
  when: docker_host_systemd_override

- name: Configure Docker systemd service override
  ansible.builtin.template:
    src: docker.service.override.j2
    dest: /etc/systemd/system/docker.service.d/override.conf
    mode: "0644"
    backup: true
  become: true
  when: docker_host_systemd_override
  notify:
    - Reload systemd daemon
  register: docker_host_daemon_config_result
