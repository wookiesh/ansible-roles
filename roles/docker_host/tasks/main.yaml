---
# Preflight: dockerd refuses to start with live-restore when swarm state exists on disk
# (even a dead leftover one), so fail now rather than after the daemon restart.
- name: Read the current Swarm state of the Docker daemon
  ansible.builtin.command: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
  register: docker_host_swarm_state
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Refuse live-restore on a host with Swarm state
  ansible.builtin.assert:
    that:
      - docker_host_swarm_state.rc != 0 or (docker_host_swarm_state.stdout | trim) == 'inactive'
    fail_msg: >-
      live-restore is incompatible with Swarm (state: {{ docker_host_swarm_state.stdout | trim }}).
      Run 'docker swarm leave --force' on the host to drop leftover state, or set
      live-restore: false in docker_host_daemon_config.
  when:
    - docker_host_daemon_config['live-restore'] | default(false) | bool
    - not (docker_host_swarm_enabled | bool)

# Phase 1: Docker installation and basic configuration
- name: Import Docker installation tasks
  ansible.builtin.include_tasks: install.yaml

- name: Import Docker configuration tasks
  ansible.builtin.include_tasks: configure.yaml

- name: Import Docker Compose installation tasks
  ansible.builtin.include_tasks: docker_compose.yaml
  when: docker_host_compose_install

- name: Import Docker user management tasks
  ansible.builtin.include_tasks: users.yaml

# Installed before the daemon restart below so that restart is covered too.
- name: Import docker.sock refresh tasks
  ansible.builtin.include_tasks: socket_refresh.yaml
  when: docker_host_socket_refresh_enabled | bool

# Phase 2: Single Docker daemon restart and stabilization
# Only when something that needs a restart actually changed: with live-restore
# disabled (swarm hosts) a restart stops every container on the node.
- name: Restart Docker daemon once after all configuration
  ansible.builtin.systemd:
    name: docker
    state: restarted
  become: true
  register: docker_host_daemon_restart_result
  when: >-
    (docker_host_daemon_json_result | default({})) is changed
    or (docker_host_systemd_override_result | default({})) is changed
    or (docker_host_script_install | default({})) is changed

- name: Wait for Docker daemon to be fully ready
  ansible.builtin.systemd:
    name: docker
  register: docker_host_daemon_status
  until: docker_host_daemon_status.status.ActiveState == "active"
  retries: 10
  delay: 5

- name: Verify Docker is working after restart
  ansible.builtin.command: docker --version
  register: docker_host_verify_after_restart
  changed_when: false

- name: Assert Docker is working after restart
  ansible.builtin.assert:
    that:
      - docker_host_verify_after_restart.rc == 0
    fail_msg: "Docker is not working after daemon restart"
    success_msg: "Docker is working correctly after restart"

# Phase 3: Install Docker SDK for Python (required for Swarm modules)
- name: Install pip for Python3
  ansible.builtin.package:
    name:
      - python3-pip
      - python3-setuptools
    state: present
  become: true
  register: docker_host_pip_install_result

- name: Install Docker SDK for Python
  ansible.builtin.package:
    name: python3-docker
    state: present
  become: true
  register: docker_host_sdk_package_result
  failed_when: false

- name: Upgrade Docker SDK for Python via pip (force upgrade)
  ansible.builtin.pip:
    name: "docker>=6.0.0"
    state: present
    extra_args: --upgrade --break-system-packages
  become: true
  when: docker_host_pip_install_result is succeeded
  register: docker_host_sdk_upgrade_result

- name: Install Docker SDK via pip as fallback
  ansible.builtin.pip:
    name: "docker>=6.0.0"
    state: present
  become: true
  register: docker_host_sdk_pip_result
  failed_when: false

# Phase 4: Docker Swarm setup (only after Docker is fully stable)
- name: Set Docker configuration completed flag
  ansible.builtin.set_fact:
    docker_host_config_completed: true
    cacheable: true

- name: Import Docker Swarm initialization tasks
  ansible.builtin.include_tasks: swarm_init.yaml
  when: docker_host_swarm_enabled

- name: Import Docker Swarm join tasks
  ansible.builtin.include_tasks: swarm_join.yaml
  when: docker_host_swarm_enabled

- name: Import Docker Swarm configuration tasks
  ansible.builtin.include_tasks: swarm_configure.yaml
  when: docker_host_swarm_enabled

- name: Import Docker Swarm validation tasks
  ansible.builtin.include_tasks: swarm_validate.yaml
  when: docker_host_swarm_enabled
