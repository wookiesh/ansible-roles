---
- name: Test docker_host role
  hosts: localhost
  become: true
  gather_facts: true
  vars:
    docker_host_install_method: "script"
    docker_host_version: "latest"
    docker_host_auto_update: false
    docker_host_skip_update_if_running: true
    docker_host_user: "{{ ansible_user_id }}"
    docker_host_add_user_to_group: true

  tasks:
    - name: Include docker_host role
      ansible.builtin.include_role:
        name: docker_host

  post_tasks:
    - name: Verify Docker is installed
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      failed_when: docker_version.rc != 0

    - name: Verify Docker service is active
      ansible.builtin.systemd:
        name: docker
      register: docker_service
      failed_when: docker_service.status.ActiveState != "active"

    - name: Verify user is in docker group
      ansible.builtin.command: groups "{{ ansible_user_id }}"
      register: user_groups
      changed_when: false
      failed_when: "'docker' not in user_groups.stdout"

    - name: Verify Docker works
      ansible.builtin.command: docker run --rm hello-world
      changed_when: false
