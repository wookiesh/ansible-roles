---
# Handlers for Docker role
- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  become: true

- name: Reload Docker daemon configuration
  ansible.builtin.systemd:
    name: docker
    state: reloaded
  become: true

- name: Reset Docker daemon failure state
  ansible.builtin.systemd:
    name: docker
    state: reset-failed
  become: true

- name: Flush Docker daemon logs
  ansible.builtin.command: journalctl --flush
  become: true
  changed_when: false
