---
- name: Create Uptime Kuma install directory
  ansible.builtin.file:
    path: "{{ uptimekuma_install_dir }}"
    state: directory
    owner: root
    group: "{{ docker_host_services_group | default('docker') }}"
    mode: "2775"
  become: true

- name: Create Uptime Kuma data directory
  ansible.builtin.file:
    path: "{{ uptimekuma_install_dir }}/uptime-data"
    state: directory
    owner: root
    group: "{{ docker_host_services_group | default('docker') }}"
    mode: "2775"
  become: true

- name: Deploy Uptime Kuma stack/compose file
  ansible.builtin.template:
    src: "{{ uptimekuma_deployment_mode }}.yaml.j2"
    dest: "{{ uptimekuma_install_dir }}/stack.yaml"
    owner: root
    group: "{{ docker_host_services_group | default('docker') }}"
    mode: "0640"
  become: true
  run_once: "{{ uptimekuma_deployment_mode == 'stack' }}"
  delegate_to: "{{ docker_swarm_manager if uptimekuma_deployment_mode == 'stack' else inventory_hostname }}"
  notify: deploy uptimekuma
