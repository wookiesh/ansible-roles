---
- name: Deploy Uptime Kuma (swarm stack)
  ansible.builtin.command: docker stack deploy -c stack.yaml uptimekuma
  args:
    chdir: "{{ uptimekuma_install_dir }}"
  register: uptimekuma_stack_result
  changed_when: ((uptimekuma_stack_result.stdout | default('')) | regex_search('(Updating|Creating)')) is not none
  when:
    - uptimekuma_deployment_mode == "stack"
    - inventory_hostname == docker_swarm_manager

- name: Deploy Uptime Kuma (compose)
  community.docker.docker_compose_v2:
    project_src: "{{ uptimekuma_install_dir }}"
    state: present
  when: uptimekuma_deployment_mode == "compose"
