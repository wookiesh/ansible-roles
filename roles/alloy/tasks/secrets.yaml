---
- name: Validate vault variable for Grafana Cloud API key
  ansible.builtin.assert:
    that:
      - vault_grafana_cloud_api_key is defined
      - vault_grafana_cloud_api_key | length > 0
    fail_msg: |
      ❌ Missing required vault variable: vault_grafana_cloud_api_key

      Add to your vault.yml:
      vault_grafana_cloud_api_key: "your_grafana_cloud_api_key"

      Generate an API key in Grafana Cloud:
      1. Go to your Grafana Cloud stack → Security → API keys
      2. Create a key with MetricsPublisher role
    success_msg: "✅ Grafana Cloud API key is present"

- name: Create Grafana Cloud API key secret in Docker Swarm
  community.docker.docker_secret:
    name: grafana_cloud_api_key
    data: "{{ vault_grafana_cloud_api_key }}"
    state: present
  run_once: true
  delegate_to: "{{ docker_swarm_manager | default(inventory_hostname) }}"

- name: Update Grafana Cloud API key secret when forced
  community.docker.docker_secret:
    name: grafana_cloud_api_key
    data: "{{ vault_grafana_cloud_api_key }}"
    state: present
    force: true
  run_once: true
  delegate_to: "{{ docker_swarm_manager | default(inventory_hostname) }}"
  when: alloy_force_secrets_update | default(false)
