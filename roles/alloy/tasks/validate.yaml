---
- name: Validate Loki configuration
  ansible.builtin.assert:
    that:
      - alloy_grafana_cloud_loki_url | length > 0
      - alloy_grafana_cloud_loki_username | length > 0
    fail_msg: |
      ❌ Missing Loki configuration:
      - alloy_grafana_cloud_loki_url: {{ alloy_grafana_cloud_loki_url | default('UNDEFINED') }}
      - alloy_grafana_cloud_loki_username: {{ alloy_grafana_cloud_loki_username | default('UNDEFINED') }}
    success_msg: "✅ Loki configuration is valid"
  when: alloy_loki_enabled

- name: Validate Prometheus configuration
  ansible.builtin.assert:
    that:
      - alloy_grafana_cloud_prometheus_url | length > 0
      - alloy_grafana_cloud_prometheus_username | length > 0
    fail_msg: |
      ❌ Missing Prometheus configuration:
      - alloy_grafana_cloud_prometheus_url: {{ alloy_grafana_cloud_prometheus_url | default('UNDEFINED') }}
      - alloy_grafana_cloud_prometheus_username: {{ alloy_grafana_cloud_prometheus_username | default('UNDEFINED') }}
    success_msg: "✅ Prometheus configuration is valid"
  when: alloy_metrics_enabled

- name: Validate Traefik log path
  ansible.builtin.assert:
    that:
      - alloy_traefik_log_path | length > 0
    fail_msg: |
      ❌ alloy_traefik_log_path is required when alloy_traefik_logs_enabled is true.
      Set it to match traefik_access_log_path on this host.
    success_msg: "✅ Traefik log path is set: {{ alloy_traefik_log_path }}"
  when: alloy_traefik_logs_enabled

- name: Validate Docker integration
  ansible.builtin.assert:
    that:
      - docker_host_services_root is defined
      - docker_host_services_group is defined
    fail_msg: "❌ docker_host role variables are missing"
    success_msg: "✅ Docker integration variables are valid"
