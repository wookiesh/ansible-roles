---
# Grafana Alloy observability agent
alloy_version: "v1.7.4"

# Deployment mode: compose (default) or swarm
alloy_deployment_mode: "{{ 'swarm' if docker_host_swarm_enabled | default(false) else 'compose' }}"

# Deployment paths
alloy_docker_services_root: "{{ docker_host_services_root | default('/opt/docker') }}"
alloy_install_dir: "{{ alloy_docker_services_root }}/alloy"
alloy_config_dir: "{{ alloy_install_dir }}/config"
alloy_secrets_dir: "{{ alloy_install_dir }}/secrets"
alloy_compose_file: "{{ alloy_install_dir }}/compose.yaml"
alloy_swarm_file: "{{ alloy_install_dir }}/swarm.yaml"

# Swarm — global mode, managers only by default
alloy_swarm_placement_constraints:
  - "node.role == manager"
alloy_swarm_resources:
  limits:
    cpus: "0.5"
    memory: 256M
  reservations:
    cpus: "0.1"
    memory: 64M
alloy_swarm_restart_policy:
  condition: any
  delay: 5s
  max_attempts: 3
  window: 120s

# Grafana Cloud — Loki (logs)
alloy_loki_enabled: true
alloy_grafana_cloud_loki_url: ""
alloy_grafana_cloud_loki_username: ""

# Grafana Cloud — Prometheus/Mimir (metrics, opt-in)
alloy_metrics_enabled: false
alloy_grafana_cloud_prometheus_url: ""
alloy_grafana_cloud_prometheus_username: ""
alloy_traefik_metrics_port: "8899"
alloy_scrape_interval: "30s"

# Additional static Prometheus scrape targets, remote-written to the same
# Grafana Cloud endpoint as Traefik metrics. For hosts this Alloy instance
# doesn't run on (e.g. non-Docker hosts running native exporters) — Alloy
# pulls from them over the network instead of needing an agent there.
#   alloy_extra_scrape_targets:
#     - job_name: "smtp_relay_node"
#       targets:
#         - { address: "10.0.0.10:9100", instance: "relay-01" }
#       scrape_interval: "30s"  # optional, defaults to alloy_scrape_interval
alloy_extra_scrape_targets: []

# When alloy runs as a Swarm `global` service (one replica per manager),
# every replica renders the same alloy_extra_scrape_targets — scraping
# remote, non-Docker targets from every manager independently multiplies
# active series for no benefit (unlike Traefik's own local metrics, which
# are legitimately per-node). Set this to a single inventory_hostname (e.g.
# the cluster's designated primary/manager) to have only that one host
# render the extra scrape blocks. Empty (default) = every host scrapes,
# preserving prior behavior.
alloy_extra_scrape_targets_host: ""

# Traefik log collection
# Set alloy_traefik_log_path to match traefik_access_log_path
alloy_traefik_logs_enabled: true
alloy_traefik_log_path: ""

# Labels added to all telemetry
alloy_environment: "production"
alloy_cluster: ""
alloy_extra_labels: {}
