---
- name: Test GlusterFS role
  hosts: glusterfs_nodes
  become: true
  gather_facts: true
  vars:
    glusterfs_cluster_name: "test_cluster"
    glusterfs_volume_name: "test_gv_swarm"
    glusterfs_group_name: "glusterfs_nodes"
    glusterfs_brick_dir: "/tmp/test_glusterfs/brick"
    glusterfs_mount_dir: "/tmp/test_glusterfs/mount"
    glusterfs_replica_count: 2
    glusterfs_firewall_enabled: false

  pre_tasks:
    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      loop:
        - "/tmp/test_glusterfs"
        - "{{ glusterfs_brick_dir }}"
        - "{{ glusterfs_mount_dir }}"

  tasks:
    - name: Include GlusterFS role
      ansible.builtin.include_role:
        name: glusterfs

  post_tasks:
    - name: Verify GlusterFS is installed
      ansible.builtin.command: gluster --version
      register: gluster_version
      changed_when: false
      failed_when: gluster_version.rc != 0

    - name: Verify glusterd service is active
      ansible.builtin.systemd:
        name: glusterd
      register: gluster_service
      failed_when: gluster_service.status.ActiveState != "active"
