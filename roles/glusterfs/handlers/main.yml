---
# Handlers for GlusterFS service management
- name: Restart glusterd
  ansible.builtin.systemd:
    name: glusterd
    state: restarted
  become: true
  when: glusterfs_auto_start

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Cleanup test file
  ansible.builtin.file:
    path: "{{ glusterfs_mount_dir }}/.glusterfs_test"
    state: absent
  become: true
  when: glusterfs_mount_verify is defined and glusterfs_mount_verify.stat.exists
