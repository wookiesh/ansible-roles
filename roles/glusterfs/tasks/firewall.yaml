---
# Configure firewall for GlusterFS
- name: Check if UFW is available and enabled
  ansible.builtin.command: ufw status
  register: glusterfs_ufw_check
  changed_when: false
  failed_when: false

- name: Open GlusterFS ports with UFW
  ansible.builtin.command: ufw allow "{{ item }}" comment "GlusterFS"
  loop: "{{ glusterfs_firewall_ports }}"
  when:
    - glusterfs_ufw_check.rc == 0
    - "'Status: active' in glusterfs_ufw_check.stdout"
  changed_when: true
  become: true

- name: Check if firewalld is available and enabled
  ansible.builtin.systemd:
    name: firewalld
  register: glusterfs_firewalld_check
  failed_when: false

- name: Check firewalld runtime status
  ansible.builtin.command: firewall-cmd --state
  register: glusterfs_firewalld_runtime_check
  changed_when: false
  failed_when: false
  when: glusterfs_firewalld_check.status is defined and glusterfs_firewalld_check.status.ActiveState == "active"

- name: Open GlusterFS ports with firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ glusterfs_firewall_ports }}"
  when:
    - glusterfs_firewalld_check.status is defined
    - glusterfs_firewalld_check.status.ActiveState == "active"
    - glusterfs_firewalld_runtime_check.rc == 0
    - "'running' in glusterfs_firewalld_runtime_check.stdout"

- name: Set firewall status facts
  ansible.builtin.set_fact:
    glusterfs_ufw_active: "{{ glusterfs_ufw_check.rc == 0 and 'Status: active' in glusterfs_ufw_check.stdout }}"
    glusterfs_firewalld_active: >-
      {{ glusterfs_firewalld_check.status is defined and
         glusterfs_firewalld_check.status.ActiveState == 'active' and
         glusterfs_firewalld_runtime_check.rc == 0 and
         'running' in glusterfs_firewalld_runtime_check.stdout }}

- name: Display firewall configuration note
  ansible.builtin.debug:
    msg: |
      ⚠️  Firewall Configuration:
      UFW Status: {{ 'Active' if glusterfs_ufw_active else 'Inactive/Not Available' }}
      Firewalld Status: {{ 'Active' if glusterfs_firewalld_active else 'Inactive/Not Available' }}

      If neither firewall is active, please manually open these ports:
      {% for port in glusterfs_firewall_ports %}
      - {{ port }}
      {% endfor %}
  when: not (glusterfs_ufw_active | bool) and not (glusterfs_firewalld_active | bool)
